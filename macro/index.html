const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw,remember){
  const msg=document.getElementById('msg');msg.textContent='解密中…';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.v)},key,ub(P.c));
    if(remember)try{localStorage.setItem('vd_pw',pw)}catch(e){}
    if(location.hash)history.replaceState(null,'',location.pathname);
    const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
  }catch(e){msg.textContent='密碼錯誤';try{localStorage.removeItem('vd_pw')}catch(_){}}
}
document.getElementById('go').onclick=()=>open_(document.getElementById('pw').value,document.getElementById('rem').checked);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});
const h=new URLSearchParams(location.hash.slice(1)).get('k');let saved=null;try{saved=localStorage.getItem('vd_pw')}catch(e){}
if(h)open_(h,true);else if(saved)open_(saved,true);
window.addEventListener('hashchange',()=>{const k=new URLSearchParams(location.hash.slice(1)).get('k');if(k)open_(k,true)});
</script></body></html>
